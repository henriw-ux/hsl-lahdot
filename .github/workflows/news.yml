name: Update news
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Yle feeds
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          FEEDS = {
            "local": "https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_UUTISET&concepts=18-194469",
            "top": "https://feeds.yle.fi/uutiset/v1/mostRead/YLE_UUTISET.rss",
          }
          try:
            old = json.load(open("news.json", encoding="utf-8"))
          except Exception:
            old = {}
          out = {}
          for key, url in FEEDS.items():
            try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              root = ET.fromstring(urllib.request.urlopen(req, timeout=20).read())
              items = [{"title": (i.findtext("title") or "").strip(), "date": i.findtext("pubDate") or ""} for i in root.iter("item")]
              out[key] = [i for i in items if i["title"]][:15] or old.get(key, [])
            except Exception as e:
              print("failed", key, e)
              out[key] = old.get(key, [])
          json.dump(out, open("news.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
