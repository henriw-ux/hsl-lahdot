<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lähdöt</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --line: #262d38;
    --text: #e8ecf1;
    --muted: #8a94a3;
    --badge: #007ac9;
    --live: #5fd47a;
    --warn: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body { padding: 12px; }
  #grid { display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .stop { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stop h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .stop .sub { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center;
    padding: 6px 0; border-top: 1px solid var(--line); font-size: 17px; }
  .line { background: var(--badge); color: #fff; font-weight: 700; text-align: center;
    border-radius: 4px; padding: 2px 0; font-size: 16px; }
  .dest { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-variant-numeric: tabular-nums; text-align: right; }
  .time.live { color: var(--live); }
  .time small { color: var(--live); margin-right: 6px; font-size: 13px; }
  .empty, #error { color: var(--muted); padding: 8px 0; }
  #error { color: var(--warn); }
  #updated { color: var(--muted); font-size: 12px; text-align: right; margin-top: 8px; }

  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #grid { flex: none; }
  #news { flex: 1; min-height: 0; margin-top: 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #news .col { min-height: 0; display: flex; flex-direction: column; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 4px; }
  #news h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: .08em; }
  #news .list { flex: 1; min-height: 0; overflow: hidden; }
  #news .n { padding: 9px 0; border-top: 1px solid var(--line); }
  #news .n:first-child { border-top: 0; }
  #news .t { font-size: 18px; font-weight: 500; line-height: 1.25; }
  #news .a { color: var(--muted); font-size: 12px; margin-top: 3px; }
  @media (max-width: 600px) { #news { grid-template-columns: 1fr; } }

  /* Vuodenaikateemat: hillitty sävy taustaan ja korttien reunoihin */
  :root { --accent: #9cc4ee; --glow: rgba(120,170,230,.10); --dim: 1; }
  :root[data-season="winter"] { --bg:#0d1218; --card:#161d27; --line:#253040; --glow:rgba(120,170,230,.10); --accent:#9cc4ee; }
  :root[data-season="spring"] { --bg:#0e1411; --card:#161e19; --line:#26332b; --glow:rgba(130,200,140,.09); --accent:#9bd1a4; }
  :root[data-season="summer"] { --bg:#131210; --card:#1d1b16; --line:#333024; --glow:rgba(240,200,110,.08); --accent:#e8cf8f; }
  :root[data-season="autumn"] { --bg:#141010; --card:#1e1816; --line:#382b26; --glow:rgba(230,140,80,.09); --accent:#e6a577; }
  html { background: var(--bg); transition: background 2s; }
  body { background: radial-gradient(900px 420px at 100% 0%, var(--glow), transparent 70%), var(--bg);
    filter: brightness(var(--dim)); transition: filter 3s; }

  #top { flex: none; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between;
    align-items: center; padding: 2px 6px 12px; }
  #time { font-size: 68px; font-weight: 300; line-height: 1; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  #date { font-size: 20px; color: var(--accent); margin-top: 6px; }
  #wx { display: flex; align-items: center; gap: 22px; }
  #wx .now { display: flex; align-items: center; gap: 10px; }
  #wx .ic { font-size: 44px; line-height: 1; }
  #wx .temp { font-size: 48px; font-weight: 300; line-height: 1; }
  #wx .wdesc { color: var(--muted); font-size: 14px; margin-top: 4px; max-width: 190px; }
  #wx .fc { display: flex; gap: 14px; }
  #wx .fc div { display: flex; flex-direction: column; align-items: center; font-size: 14px; gap: 2px; color: var(--muted); }
  #wx .fc .fi { font-size: 22px; }
  #wx .fc b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<header id="top"><div id="clock"><div id="time"></div><div id="date"></div></div><div id="wx" hidden><div class="now"><span class="ic" id="wIcon"></span><div><div class="temp" id="wTemp"></div><div class="wdesc" id="wDesc"></div></div></div><div class="fc" id="wFc"></div></div></header>
<div id="error" hidden></div>
<div id="grid"></div>
<div id="updated"></div>
<section id="news"><div class="col"><h3>Helsinki</h3><div class="list" id="newsLocal"><div class="n"><div class="a">Ladataan…</div></div></div></div><div class="col"><h3>Luetuimmat</h3><div class="list" id="newsTop"><div class="n"><div class="a">Ladataan…</div></div></div></div></section>

<script>
// ====== ASETUKSET ======
// Rajapinta-avain: luo ilmainen avain osoitteessa https://portal-api.digitransit.fi
// Voit myös antaa avaimen osoitteessa: sivu.html?key=AVAIN
const API_KEY = "c50a4c932b8e4a5f809108a63164202d";

// Pysäkkien lyhytkoodit samassa järjestyksessä kuin HSL-sovelluksen kuvassa
const STOP_CODES = ["H3092","H3136","H3090","H3066","H3082","H3032"];

const DEPARTURES = 5;       // lähtöjä per pysäkki
const REFRESH_SECONDS = 30; // päivitysväli
// =======================

const ENDPOINT = "https://api.digitransit.fi/routing/v2/hsl/gtfs/v1";
const key = new URLSearchParams(location.search).get("key") || API_KEY;

// Vaihe 1: etsitään pysäkit lyhytkoodilla Käpylän/Koskelan alueelta
const LOOKUP_QUERY = `{
  stopsByRadius(lat: 60.2150, lon: 24.9560, radius: 3000, first: 1000) {
    edges { node { stop { gtfsId code name desc } } }
  }
}`;
let stopIds = null; // koodi -> gtfsId

// Vaihe 2: haetaan lähdöt löydetyille pysäkeille
function departuresQuery(ids) {
  return `{ stops(ids: ${JSON.stringify(ids)}) {
    gtfsId code name desc
    stoptimesWithoutPatterns(numberOfDepartures: ${DEPARTURES}) {
      serviceDay realtimeDeparture realtime headsign
      trip { route { shortName } }
    }
  } }`;
}

async function gql(query) {
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "digitransit-subscription-key": key },
    body: JSON.stringify({ query })
  });
  if (!res.ok) throw new Error("Rajapinta vastasi: " + res.status + (res.status === 401 || res.status === 403 ? " (tarkista avain)" : ""));
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(stops) {
  const html = STOP_CODES.map((code) => {
    const stop = stops.find(s => s && s.code === code);
    if (!stop) return `<div class="stop"><h2>${esc(code)}</h2><div class="empty">Pysäkkiä ei löytynyt</div></div>`;
    const now = Date.now();
    const rows = stop.stoptimesWithoutPatterns.map(t => {
      const ms = (t.serviceDay + t.realtimeDeparture) * 1000;
      const d = new Date(ms);
      const mins = Math.round((ms - now) / 60000);
      const hhmm = pad(d.getHours()) + ":" + pad(d.getMinutes());
      const soon = mins >= 0 && mins < 10 ? `<small>${mins} min</small>` : "";
      return `<div class="row">
        <div class="line">${esc(t.trip.route.shortName)}</div>
        <div class="dest">${esc(t.headsign)}</div>
        <div class="time ${t.realtime ? "live" : ""}">${soon}${hhmm}</div>
      </div>`;
    }).join("") || `<div class="empty">Ei lähtöjä</div>`;
    return `<div class="stop">
      <h2>${esc(stop.name)}</h2>
      <div class="sub">${esc(stop.desc || "")} · ${esc(stop.code)}</div>
      ${rows}
    </div>`;
  }).join("");
  document.getElementById("grid").innerHTML = html;
  const n = new Date();
  document.getElementById("updated").textContent = "Päivitetty " + pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds());
}

async function load() {
  const err = document.getElementById("error");
  try {
    if (!stopIds) {
      const d = await gql(LOOKUP_QUERY);
      const found = {};
      for (const e of d.stopsByRadius.edges) {
        const st = e.node.stop;
        if (STOP_CODES.includes(st.code)) found[st.code] = st.gtfsId;
      }
      stopIds = found;
    }
    const ids = Object.values(stopIds);
    const d2 = ids.length ? await gql(departuresQuery(ids)) : { stops: [] };
    err.hidden = true;
    render(d2.stops);
  } catch (e) {
    stopIds = null;
    err.textContent = "Tietojen haku epäonnistui: " + e.message;
    err.hidden = false;
  }
}

load();
setInterval(load, REFRESH_SECONDS * 1000);

// ====== UUTISET (Yle Uutiset: Helsinki + luetuimmat) ======
// Ylen RSS-ehdot sallivat otsikoiden näyttämisen; kuvia tai artikkelitekstejä ei käytetä.
const FEEDS = [
  { el: "newsLocal", key: "local", time: true,  url: "https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_UUTISET&concepts=18-194469" }, // Helsinki
  { el: "newsTop",   key: "top",   time: false, url: "https://feeds.yle.fi/uutiset/v1/mostRead/YLE_UUTISET.rss" }                               // luetuimmat
];
const NEWS_REFRESH_MINUTES = 3;
// Selain ei voi hakea Ylen syötettä suoraan, joten haku kulkee välipalvelun kautta. Kokeillaan järjestyksessä.
const PROXIES = [
  { name: "rss2json",  xml: false, make: u => "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u) },
  { name: "allorigins", xml: true,  make: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) }
];
const newsCache = {};

async function fetchWithTimeout(url, ms = 8000) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { signal: c.signal, cache: "no-store" }); } finally { clearTimeout(t); }
}
async function fetchFeed(url) {
  const bust = url;
  const errors = [];
  for (const p of PROXIES) {
    try {
      const res = await fetchWithTimeout(p.make(bust), 7000);
      if (!res.ok) { errors.push(p.name + " " + res.status); continue; }
      let items;
      if (p.xml) {
        const doc = new DOMParser().parseFromString(await res.text(), "text/xml");
        items = [...doc.querySelectorAll("item")].map(i => ({
          title: (i.querySelector("title") || {}).textContent,
          date: (i.querySelector("pubDate") || {}).textContent
        }));
      } else {
        const j = await res.json();
        if (j.status !== "ok") { errors.push(p.name + " " + (j.message || j.status)); continue; }
        items = j.items.map(i => ({ title: i.title, date: i.pubDate }));
      }
      items = items.filter(i => i.title && i.title.trim());
      if (items.length) return items;
      errors.push(p.name + " tyhjä");
    } catch (e) { errors.push(p.name + " " + (e.name === "AbortError" ? "aikakatkaisu" : "virhe")); }
  }
  throw new Error(errors.join(", "));
}
function ago(str) {
  if (!str) return "";
  const t = /^\d{4}-\d\d-\d\d \d/.test(str) ? new Date(str.replace(" ", "T") + "Z") : new Date(str);
  const m = Math.round((Date.now() - t.getTime()) / 60000);
  if (isNaN(m)) return "";
  if (m < 60) return Math.max(m, 1) + " min sitten";
  if (m < 1440) return Math.round(m / 60) + " h sitten";
  return Math.round(m / 1440) + " vrk sitten";
}
function renderFeed(f) {
  const items = newsCache[f.el];
  if (!items) return;
  document.getElementById(f.el).innerHTML = items.slice(0, 12).map(it =>
    `<div class="n"><div class="t">${esc(it.title.trim())}</div>` +
    (f.time && it.date ? `<div class="a">${esc(ago(it.date))}</div>` : "") + `</div>`).join("");
}
function fitNews() {
  document.querySelectorAll("#news .list").forEach(list => {
    const items = [...list.children];
    items.forEach(i => i.style.display = "");
    const limit = list.getBoundingClientRect().bottom;
    items.forEach(i => { if (i.getBoundingClientRect().bottom > limit + 1) i.style.display = "none"; });
  });
}
async function loadNews() {
  document.getElementById("news").hidden = false;
  // 1) Ensisijainen lähde: news.json samalta sivustolta (päivittää GitHub Actions -automaatio)
  let local = null;
  try {
    const r = await fetchWithTimeout("news.json?_=" + Date.now(), 6000);
    if (r.ok) local = await r.json();
  } catch (e) { /* ei news.json:ia, käytetään välipalveluja */ }
  await Promise.all(FEEDS.map(async f => {
    try {
      newsCache[f.el] = (local && local[f.key] && local[f.key].length) ? local[f.key] : await fetchFeed(f.url);
    } catch (e) {
      if (!newsCache[f.el]) {
        document.getElementById(f.el).innerHTML = `<div class="n"><div class="a">Uutisten haku epäonnistui (${esc(e.message)}). Yritetään uudelleen…</div></div>`;
        return;
      }
    }
    renderFeed(f);
  }));
  fitNews();
}
loadNews();
setInterval(loadNews, NEWS_REFRESH_MINUTES * 60000);
setTimeout(() => { if (!Object.keys(newsCache).length) loadNews(); }, 20000);
// Ajat ("12 min sitten") päivittyvät ilman uutta hakua
setInterval(() => { FEEDS.forEach(renderFeed); fitNews(); }, 60000);
window.addEventListener("resize", fitNews);

// ====== KELLO, PÄIVÄMÄÄRÄ, TEEMA ======
const urlParams = new URLSearchParams(location.search);
const DIM_FROM_HOUR = 22, DIM_TO_HOUR = 6, DIM_LEVEL = 0.55; // yöllä himmennys (1 = ei himmennystä)

function season(month) {
  if (month === 11 || month <= 1) return "winter";
  if (month <= 4) return "spring";
  if (month <= 7) return "summer";
  return "autumn";
}
function tick() {
  const n = new Date();
  document.getElementById("time").textContent = pad(n.getHours()) + ":" + pad(n.getMinutes());
  const d = n.toLocaleDateString("fi-FI", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("date").textContent = d.charAt(0).toUpperCase() + d.slice(1);
  const root = document.documentElement;
  root.dataset.season = urlParams.get("season") || season(n.getMonth());
  const h = n.getHours();
  const night = h >= DIM_FROM_HOUR || h < DIM_TO_HOUR;
  root.style.setProperty("--dim", urlParams.get("dim") || (night ? DIM_LEVEL : 1));
}
tick();
setInterval(tick, 10000);

// ====== SÄÄ (Open-Meteo, ei avainta) – Koskela, Helsinki ======
const WX_LAT = 60.2175, WX_LON = 24.9680, WX_REFRESH_MINUTES = 15;
const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=" + WX_LAT + "&longitude=" + WX_LON +
  "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
  "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
  "&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=4";

function wcode(c, day = true) {
  if (c === 0) return day ? ["Selkeää", "☀️"] : ["Selkeää", "🌙"];
  if (c === 1) return day ? ["Melko selkeää", "🌤️"] : ["Melko selkeää", "🌙"];
  if (c === 2) return ["Puolipilvistä", "⛅"];
  if (c === 3) return ["Pilvistä", "☁️"];
  if (c === 45 || c === 48) return ["Sumua", "🌫️"];
  if (c >= 51 && c <= 57) return ["Tihkua", "🌦️"];
  if (c === 61 || c === 80) return ["Heikkoa sadetta", "🌦️"];
  if (c === 63 || c === 81) return ["Sadetta", "🌧️"];
  if (c === 65 || c === 82 || c === 66 || c === 67) return ["Kovaa sadetta", "🌧️"];
  if (c === 71 || c === 85) return ["Heikkoa lumisadetta", "🌨️"];
  if (c === 73 || c === 75 || c === 77 || c === 86) return ["Lumisadetta", "❄️"];
  if (c >= 95) return ["Ukkosta", "⛈️"];
  return ["", "🌡️"];
}
const deg = v => Math.round(v) + "°";

async function loadWeather() {
  try {
    const res = await fetch(WX_URL);
    const j = await res.json();
    const c = j.current;
    const [txt, icon] = wcode(c.weather_code, c.is_day === 1);
    document.getElementById("wIcon").textContent = icon;
    document.getElementById("wTemp").textContent = deg(c.temperature_2m);
    document.getElementById("wDesc").textContent =
      "Koskela · " + txt + " · tuntuu " + deg(c.apparent_temperature) + " · " + Math.round(c.wind_speed_10m) + " m/s";
    document.getElementById("wFc").innerHTML = j.daily.time.slice(1, 4).map((t, i) => {
      const k = i + 1;
      const wd = new Date(t + "T12:00:00").toLocaleDateString("fi-FI", { weekday: "short" });
      return `<div><span>${esc(wd)}</span><span class="fi">${wcode(j.daily.weather_code[k])[1]}</span>` +
        `<span><b>${deg(j.daily.temperature_2m_max[k])}</b> ${deg(j.daily.temperature_2m_min[k])}</span></div>`;
    }).join("");
    document.getElementById("wx").hidden = false;
    fitNews();
  } catch (e) { /* säävirhe ei estä muuta näkymää */ }
}
loadWeather();
setInterval(loadWeather, WX_REFRESH_MINUTES * 60000);
</script>
</body>
</html>
