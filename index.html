<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lähdöt</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --line: #262d38;
    --text: #e8ecf1;
    --muted: #8a94a3;
    --badge: #007ac9;
    --live: #5fd47a;
    --warn: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body { padding: 12px; }
  #grid { display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .stop { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stop h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .stop .sub { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center;
    padding: 6px 0; border-top: 1px solid var(--line); font-size: 17px; }
  .line { background: var(--badge); color: #fff; font-weight: 700; text-align: center;
    border-radius: 4px; padding: 2px 0; font-size: 16px; }
  .dest { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-variant-numeric: tabular-nums; text-align: right; }
  .time.live { color: var(--live); }
  .time small { color: var(--live); margin-right: 6px; font-size: 13px; }
  .empty, #error { color: var(--muted); padding: 8px 0; }
  #error { color: var(--warn); }
  #updated { color: var(--muted); font-size: 12px; text-align: right; margin-top: 8px; }

  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #grid { flex: none; }
  #news { flex: 1; min-height: 0; margin-top: 4px; display: flex; flex-direction: column; }
  #news h3 { margin: 6px 2px 8px; font-size: 18px; font-weight: 600; color: var(--muted); }
  #newsList { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
  .item { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .item.noimg { grid-template-columns: 1fr; }
  .item img { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: var(--line); }
  .item .t { font-size: 19px; font-weight: 600; line-height: 1.25; }
  .item .d { color: var(--muted); font-size: 15px; margin-top: 4px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .a { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div id="error" hidden></div>
<div id="grid"></div>
<div id="updated"></div>
<section id="news" hidden><h3>Yle Uutiset</h3><div id="newsList"></div></section>

<script>
// ====== ASETUKSET ======
// Rajapinta-avain: luo ilmainen avain osoitteessa https://portal-api.digitransit.fi
// Voit myös antaa avaimen osoitteessa: sivu.html?key=AVAIN
const API_KEY = "c50a4c932b8e4a5f809108a63164202d";

// Pysäkkien lyhytkoodit samassa järjestyksessä kuin HSL-sovelluksen kuvassa
const STOP_CODES = ["H3092","H3136","H3090","H3066","H3082","H3032"];

const DEPARTURES = 5;       // lähtöjä per pysäkki
const REFRESH_SECONDS = 30; // päivitysväli
// =======================

const ENDPOINT = "https://api.digitransit.fi/routing/v2/hsl/gtfs/v1";
const key = new URLSearchParams(location.search).get("key") || API_KEY;

// Vaihe 1: etsitään pysäkit lyhytkoodilla Käpylän/Koskelan alueelta
const LOOKUP_QUERY = `{
  stopsByRadius(lat: 60.2150, lon: 24.9560, radius: 3000, first: 1000) {
    edges { node { stop { gtfsId code name desc } } }
  }
}`;
let stopIds = null; // koodi -> gtfsId

// Vaihe 2: haetaan lähdöt löydetyille pysäkeille
function departuresQuery(ids) {
  return `{ stops(ids: ${JSON.stringify(ids)}) {
    gtfsId code name desc
    stoptimesWithoutPatterns(numberOfDepartures: ${DEPARTURES}) {
      serviceDay realtimeDeparture realtime headsign
      trip { route { shortName } }
    }
  } }`;
}

async function gql(query) {
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", "digitransit-subscription-key": key },
    body: JSON.stringify({ query })
  });
  if (!res.ok) throw new Error("Rajapinta vastasi: " + res.status + (res.status === 401 || res.status === 403 ? " (tarkista avain)" : ""));
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0].message);
  return json.data;
}

const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(stops) {
  const html = STOP_CODES.map((code) => {
    const stop = stops.find(s => s && s.code === code);
    if (!stop) return `<div class="stop"><h2>${esc(code)}</h2><div class="empty">Pysäkkiä ei löytynyt</div></div>`;
    const now = Date.now();
    const rows = stop.stoptimesWithoutPatterns.map(t => {
      const ms = (t.serviceDay + t.realtimeDeparture) * 1000;
      const d = new Date(ms);
      const mins = Math.round((ms - now) / 60000);
      const hhmm = pad(d.getHours()) + ":" + pad(d.getMinutes());
      const soon = mins >= 0 && mins < 10 ? `<small>${mins} min</small>` : "";
      return `<div class="row">
        <div class="line">${esc(t.trip.route.shortName)}</div>
        <div class="dest">${esc(t.headsign)}</div>
        <div class="time ${t.realtime ? "live" : ""}">${soon}${hhmm}</div>
      </div>`;
    }).join("") || `<div class="empty">Ei lähtöjä</div>`;
    return `<div class="stop">
      <h2>${esc(stop.name)}</h2>
      <div class="sub">${esc(stop.desc || "")} · ${esc(stop.code)}</div>
      ${rows}
    </div>`;
  }).join("");
  document.getElementById("grid").innerHTML = html;
  const n = new Date();
  document.getElementById("updated").textContent = "Päivitetty " + pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds());
}

async function load() {
  const err = document.getElementById("error");
  try {
    if (!stopIds) {
      const d = await gql(LOOKUP_QUERY);
      const found = {};
      for (const e of d.stopsByRadius.edges) {
        const st = e.node.stop;
        if (STOP_CODES.includes(st.code)) found[st.code] = st.gtfsId;
      }
      stopIds = found;
    }
    const ids = Object.values(stopIds);
    const d2 = ids.length ? await gql(departuresQuery(ids)) : { stops: [] };
    err.hidden = true;
    render(d2.stops);
  } catch (e) {
    stopIds = null;
    err.textContent = "Tietojen haku epäonnistui: " + e.message;
    err.hidden = false;
  }
}

load();
setInterval(load, REFRESH_SECONDS * 1000);

// ====== UUTISET ======
const NEWS_FEED = "https://feeds.yle.fi/uutiset/v1/majorHeadlines/YLE_UUTISET.rss";
const NEWS_REFRESH_MINUTES = 10;
const NEWS_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(NEWS_FEED);

const plain = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.trim(); };
function ago(str) {
  const t = new Date(str.replace(" ", "T") + (str.includes("T") || /Z|[+-]\d\d:?\d\d$/.test(str) ? "" : "Z"));
  const m = Math.round((Date.now() - t.getTime()) / 60000);
  if (isNaN(m)) return "";
  if (m < 60) return Math.max(m, 1) + " min sitten";
  if (m < 1440) return Math.round(m / 60) + " h sitten";
  return Math.round(m / 1440) + " vrk sitten";
}
function fitNews() {
  const list = document.getElementById("newsList");
  const items = [...list.children];
  items.forEach(i => i.style.display = "");
  const limit = list.getBoundingClientRect().bottom;
  items.forEach(i => { if (i.getBoundingClientRect().bottom > limit + 1) i.style.display = "none"; });
}
async function loadNews() {
  try {
    const res = await fetch(NEWS_URL);
    const json = await res.json();
    if (json.status !== "ok") throw new Error("virhe");
    const html = json.items.slice(0, 12).map(it => {
      const img = it.thumbnail || (it.enclosure && it.enclosure.link) || "";
      const desc = plain(it.description);
      return `<div class="item${img ? "" : " noimg"}">
        ${img ? `<img src="${esc(img)}" alt="" onerror="this.parentNode.classList.add('noimg');this.remove();fitNews()">` : ""}
        <div><div class="t">${esc(plain(it.title))}</div>
        ${desc ? `<div class="d">${esc(desc)}</div>` : ""}
        <div class="a">${esc(ago(it.pubDate))}</div></div>
      </div>`;
    }).join("");
    document.getElementById("newsList").innerHTML = html;
    document.getElementById("news").hidden = false;
    fitNews();
  } catch (e) { /* uutisten virhe ei estä aikataulujen näyttöä */ }
}
loadNews();
setInterval(loadNews, NEWS_REFRESH_MINUTES * 60000);
window.addEventListener("resize", fitNews);
setInterval(fitNews, 30000); // aikataulujen päivitys voi muuttaa tilaa
</script>
</body>
</html>
